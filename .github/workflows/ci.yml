name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: sqlite:///${{ github.workspace }}/ci-technews.db
      CONTENT_ROOT: ${{ github.workspace }}/ci-content
      AUTH_SECRET_KEY: ci-auth-secret
      INGEST_TOKEN: ci-ingest-token
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:3012,http://localhost:3012
      TECH_RADAR_PROFILE_PATH: config/tech-radar-profile.yaml
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Run tests
        working-directory: backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build production frontend
        working-directory: frontend
        run: npm run build:prod:app
      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit --incremental false
